[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-anamoly-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{name="Kalyan sai Uddagiri", email="kalyansaiuddagiri22@gmail.com"}]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "ipykernel>=7.3.0",
    "keras>=3.15.1",
    "keras-tuner>=1.4.8",
    "matplotlib>=3.11.1",
    "openmeteo-requests>=1.7.5",
    "pandas>=3.0.5",
    "requests>=2.34.2",
    "requests-cache>=1.3.3",
    "retry-requests>=2.0.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "setuptools>=84.0.0",
    "tensorboard>=2.21.0",
    "tensorflow[and-cuda]>=2.21.0",
]

[tool.setuptools.packages.find]
where = ["src"]
